name: Secure RDP via Remote Node Script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 359
    env:
      TUNNEL_REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      TUNNEL_REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      TUNNEL_SECRET: ${{ secrets.TUNNEL_SECRET }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TUNNEL_LOCAL_PORT: 3389
      TUNNEL_SERVICE: "rdp"

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = $env:RDP_PASSWORD 
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "tky" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "tky"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "tky"
          

      - name: Fetch and Run Tunnel Script
        shell: powershell
        run: |
          $url = "https://raw.githubusercontent.com/alttky567/beta-rdp/refs/heads/main/.github/workflows/tunnel.js"
          
          Write-Host "Downloading tunnel script from $url ..."
          Invoke-WebRequest -Uri $url -OutFile "tunnel.js"
          
          Write-Host "Starting Tunnel with Heartbeat and Secret Key..."
          Start-Process node -ArgumentList "tunnel.js"
          
      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS INFO ==="
          Write-Host "RDP ready"
          Write-Host "========================`n"
          
          
      - name: Keep Tunnel Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Tunnel & Heartbeat Active..."
              Start-Sleep -Seconds 300
          }
